<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل - Adaptive Icon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        .arabic-text {
            font-family: 'Tajawal', sans-serif;
        }
        
        .icon-container {
            width: 108px;
            height: 108px;
            perspective: 1000px;
        }
        
        .icon-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        
        .icon-container:hover .icon-inner {
            transform: rotateY(180deg);
        }
        
        .icon-front, .icon-back {
            backface-visibility: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 26%;
        }
        
        .icon-back {
            transform: rotateY(180deg);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .floating {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Adaptive Icon - دليل</h1>
            
            <div class="flex flex-col items-center mb-8">
                <!-- Icon Preview -->
                <div class="icon-container mb-6 floating">
                    <div class="icon-inner">
                        <div class="icon-front bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
                            <span class="arabic-text text-white text-4xl font-bold">دليل</span>
                        </div>
                        <div class="icon-back bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shadow-lg">
                            <span class="arabic-text text-white text-4xl font-bold">دليل</span>
                        </div>
                    </div>
                </div>
                
                <p class="text-gray-600 text-center mb-4">
                    Hover over the icon to see the adaptive effect. The word "دليل" (Dalil) means "Guide" in Arabic.
                </p>
            </div>
            
            <!-- Adaptive Icon Simulation -->
            <div class="bg-gray-50 rounded-xl p-4 mb-6">
                <h2 class="font-semibold text-lg text-gray-700 mb-3">Icon in Different Contexts</h2>
                
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-gray-800 rounded-xl p-3 flex items-center justify-center">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
                            <span class="arabic-text text-white text-sm font-bold">دليل</span>
                        </div>
                    </div>
                    <div class="bg-indigo-600 rounded-xl p-3 flex items-center justify-center">
                        <div class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center">
                            <span class="arabic-text text-indigo-600 text-sm font-bold">دليل</span>
                        </div>
                    </div>
                    <div class="bg-amber-400 rounded-xl p-3 flex items-center justify-center">
                        <div class="w-12 h-12 rounded-2xl bg-gray-900 flex items-center justify-center">
                            <span class="arabic-text text-amber-400 text-sm font-bold">دليل</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Color Customization -->
            <div class="bg-gray-50 rounded-xl p-4">
                <h2 class="font-semibold text-lg text-gray-700 mb-3">Customize Colors</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Foreground</label>
                        <input type="color" value="#4f46e5" class="w-full h-10 rounded-lg cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Background</label>
                        <input type="color" value="#3b82f6" class="w-full h-10 rounded-lg cursor-pointer">
                    </div>
                </div>
                
                <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg transition duration-200">
                    Generate Icon
                </button>
            </div>
        </div>
    </div>

    <script>
        // Simple color change interaction
        const colorInputs = document.querySelectorAll('input[type="color"]');
        const iconFront = document.querySelector('.icon-front');
        const iconBack = document.querySelector('.icon-back');
        
        colorInputs[0].addEventListener('input', (e) => {
            iconFront.style.background = `linear-gradient(135deg, ${e.target.value}, ${colorInputs[1].value})`;
        });
        
        colorInputs[1].addEventListener('input', (e) => {
            iconFront.style.background = `linear-gradient(135deg, ${colorInputs[0].value}, ${e.target.value})`;
        });
    </script>
</body>
</html>
